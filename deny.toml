[advisories]
yanked = "deny"
ignore = [
    # age 0.11 uses this unmaintained build-time proc-macro through i18n-embed-fl 0.9.
    # It emits a future Rust compatibility warning. Revisit when a published age
    # release removes it and passes the vulnerability check for crypto-bigint.
    { id = "RUSTSEC-2026-0173", reason = "build-only dependency; age 0.12.1 introduces RUSTSEC-2026-0387" },
    # basic-toml is used by age's compile-time translation macros via i18n-config.
    # Current i18n-config 0.4.8 still depends on it, including via age 0.12.1.
    # This advisory reports maintenance status, not a vulnerability.
    { id = "RUSTSEC-2026-0374", reason = "build-only i18n-config dependency; no upstream replacement is available" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
